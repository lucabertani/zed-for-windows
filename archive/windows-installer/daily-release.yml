# Inactive outside .github/workflows. See archive/windows-installer/README.md.
name: Patched Zed stable for Windows (installer)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this patched stable version is already published
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: zed-windows-stable
  cancel-in-progress: false

jobs:
  stable:
    name: Resolve latest stable
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      upstream_sha: ${{ steps.release.outputs.upstream_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Resolve stable source and check existing release
        id: release
        uses: actions/github-script@v7
        env:
          FORCE_BUILD: ${{ inputs.force || false }}
        with:
          script: |
            const upstream = { owner: 'zed-industries', repo: 'zed' };
            const { data: release } = await github.rest.repos.getLatestRelease(upstream);
            if (release.draft || release.prerelease || !/^v\d+\.\d+\.\d+$/.test(release.tag_name)) {
              throw new Error(`Not a stable release: ${release.tag_name}`);
            }
            const { data: commit } = await github.rest.repos.getCommit({
              ...upstream, ref: release.tag_name,
            });
            // A distinct tag prevents an older wrap-only release from skipping
            // the first build that also permanently disables upstream updates.
            const tag = `${release.tag_name}-wrap-100000-no-updates`;
            let published = false;
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              });
              published = !existing.draft && existing.assets.some(asset =>
                asset.name === `zed-windows-x86_64-${tag}.zip` && asset.state === 'uploaded'
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            const force = context.eventName === 'workflow_dispatch' && process.env.FORCE_BUILD === 'true';
            const shouldBuild = !published || force;
            core.setOutput('upstream_tag', release.tag_name);
            core.setOutput('upstream_sha', commit.sha);
            core.setOutput('release_tag', tag);
            core.setOutput('build', shouldBuild);
            core.info(`Stable: ${release.tag_name} (${commit.sha}); already published: ${published}; force: ${force}; build: ${shouldBuild}`);

  build:
    name: Build and release Windows x64
    needs: stable
    if: needs.stable.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      # Same setting as upstream's Windows release jobs; no custom RUSTFLAGS.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      UPSTREAM_TAG: ${{ needs.stable.outputs.upstream_tag }}
      UPSTREAM_SHA: ${{ needs.stable.outputs.upstream_sha }}
      RELEASE_TAG: ${{ needs.stable.outputs.release_tag }}
    steps:
      - name: Configure long paths
        run: |
          git config --system core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not enable long paths in Git'
          }
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test patch safeguards (no compilation)
        run: ./tests/Test-Patch-Zed.ps1

      - name: Checkout immutable stable source
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: ${{ needs.stable.outputs.upstream_sha }}
          path: zed
          persist-credentials: false

      # Never restore an unpatched source tree or build before this step succeeds.
      - name: Always patch wrap to 100000 columns and disable updates in code
        run: ./Patch-Zed.ps1 -SourcePath ./zed

      - name: Install upstream Rust toolchain
        working-directory: zed
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # rustup reads the checked-out stable's rust-toolchain.toml, not nightly.
          $toolchain = (rustup show active-toolchain) -split '\s+'
          # rust-cache runs at the repository root: use the same compiler there.
          rustup default $toolchain[0]
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and compiled crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed -> target
          shared-key: windows-2022-x86_64-msvc-official-bundle-wrap100000-v1
          # Include bundle-specific optimizations in addition to the action's
          # automatic compiler, Cargo.lock and manifest/config hashes.
          key: ${{ hashFiles('zed/.cargo/bundle-config.toml', 'Patch-Zed.ps1', 'archive/windows-installer/Build-Zed.ps1') }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          cache-on-failure: "true"

      - name: Build using upstream Windows release bundler
        run: ./archive/windows-installer/Build-Zed.ps1 -SourcePath ./zed

      - name: Zip Windows executable
        id: archive
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = './zed/target/Zed-x86_64.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Upstream bundler did not produce $installer"
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "zed-windows-x86_64-$env:RELEASE_TAG.zip"
          Compress-Archive -LiteralPath $installer -DestinationPath "dist/$archive" -CompressionLevel Optimal
          "name=$archive" >> $env:GITHUB_OUTPUT
          @"
          Unofficial Windows x64 build of Zed stable [$env:UPSTREAM_TAG](https://github.com/zed-industries/zed/releases/tag/$env:UPSTREAM_TAG).

          - Upstream source commit: $env:UPSTREAM_SHA
          - With ``soft_wrap: none``, the fallback wrap threshold is 100,000 columns (not an infinite line).
          - Built with the stable source's Rust toolchain, Cargo configuration and official Windows bundling script.
          - Download and extract **$archive**, then run **Zed-x86_64.exe** (the Windows installer).
          - This unofficial build is **not code signed** by Zed Industries.
          - Automatic updates, manual update checks and Windows pending-update finalization are disabled in the source to preserve these patches, even with ``"auto_update": true``. Get new patched versions from this repository's Releases.
          "@ | Set-Content -LiteralPath dist/release-notes.md -Encoding utf8

      - name: Preserve ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish patched stable release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Keep a failed new upload as a draft, so the daily check retries it.
          $PSNativeCommandUseErrorActionPreference = $false
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>&1
          $lookupExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($lookupExitCode -ne 0) {
            # Only a genuinely missing release is safe to create.
            if (($existing -join "`n") -notmatch 'HTTP 404') {
              throw ($existing -join "`n")
            }
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA --title "Zed $env:UPSTREAM_TAG - Windows x64 (wrap 100000, no updates)" `
              --notes-file dist/release-notes.md --draft
          }
          gh release upload $env:RELEASE_TAG "dist/$env:ARCHIVE_NAME" `
            --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --notes-file dist/release-notes.md --draft=false --latest
